---
name: BluebirdATC linting and tests

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ubuntu-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.11"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: uv run python -c "import sys; print(sys.version)"

      - name: Check linting
        run: uv run ruff check bluebird-api bluebird-dt bluebird-gymnasium docs --output-format=github

      - name: Check formatting
        run: uv run ruff format bluebird-api bluebird-dt bluebird-gymnasium docs --check --diff

      - name: Check testing
        run: uv run pytest -n auto

      - name: Run notebooks
        if: github.base_ref == 'main'
        working-directory: bluebird-dt
        run: uv run pytest --nbmake examples/
        


