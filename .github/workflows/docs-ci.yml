---
name: BluebirdATC docs test

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ubuntu-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.11"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check doc build
        run: ./scripts/docs-build
