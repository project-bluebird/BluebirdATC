---
name: BluebirdATC docs test

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ubuntu-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.10"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check doc build
        run: ./scripts/docs-build
