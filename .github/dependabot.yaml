version: 2

multi-ecosystem-groups:
  ruff:
    schedule:
      interval: "weekly"
    labels:
      - "C-dependencies"
    cooldown:
      default-days: 7

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/bluebird-hmi"
    schedule:
      interval: "weekly"
    labels:
      - "C-dependencies"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Normal uv dependencies across the entire uv workspace.
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    labels:
      - "C-dependencies"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
        update-types:
          - "minor"
          - "patch"

  # Ruff, grouped with ruff-pre-commit.
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    patterns:
      - "ruff"
    multi-ecosystem-group: "ruff"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "astral-sh/ruff-pre-commit"
    multi-ecosystem-group: "ruff"

