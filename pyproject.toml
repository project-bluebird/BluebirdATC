[tool.uv.workspace]
members = [
  "bluebird-api",
  "bluebird-dt",
  "bluebird-gymnasium",
  "docs",
]

[tool.pytest.ini_options]
testpaths = [
  "bluebird-api/tests",
  "bluebird-dt/tests",
  "bluebird-gymnasium/tests",
  "docs/tests",
]

[tool.uv]
exclude-newer = "P7D"
required-version = ">=0.11.8"
