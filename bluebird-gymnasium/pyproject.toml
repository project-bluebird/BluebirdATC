[project]
name = "bluebird-gymnasium"
version = "0.2.0"
license = "AGPL-3.0-or-later"
description = "An gymnasium environment for air traffic control."
authors = [{name="Project Bluebird"}]
readme = "README.md"
requires-python = ">=3.10,<3.15"

dependencies = [
    "gymnasium>=0.29.1",
    "imageio>=2.37.4,<3",
    "jupyter>=1.1.1,<2",
    "bluebird-dt==0.2.0",
]

# list of extras (optional dependencies)
[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.15.22,<0.16",
]

[project.urls]
Documentation = "http://docs.projectbluebird.ai"
Repository = "https://github.com/project-bluebird/BluebirdATC"

[tool.uv.sources]
bluebird-dt = { workspace = true }

[tool.ruff]
extend-exclude = ["*.ipynb", "tests/*"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
  "F821", # Undefined name
  "B019", # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
  "ISC001", # clashes with formatter
  "RUF100", # Unused `noqa` directive. (Does not work for multiple on one line)
]
select = [
  "E", # pycodestyle
  "F", # Pyflakes
  "I", # isort
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "PD", # pandas-vet
  "W", # pycodestyle
  "ANN", # flake8-annotations
  "ASYNC", #flake8-async
  "A", # flake8-builtins
  "C4", # flake8-comprehensions
  "ISC", # flake8-implicit-str-concat
  "ICN", # flake8-import-conventions
  "PT", # flake8-pytest-style
  "RET", # flake8-return
  "ARG", # flake8-unused-arguments
  "PERF", #perflint
  "RUF", # ruff
  "NPY201", # numpy v2. deprecation checking
]

[tool.ruff.lint.per-file-ignores]
# ignores for the test files explicitly
"tests/*" = [
  "E712", # Avoid equality comparisons to `True`; use `if received:` for truth
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["bluebird_gymnasium"]
