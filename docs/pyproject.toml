[project]
name = "bluebird-dt-docs"
version = "0.4.0"
requires-python = ">=3.11"

dependencies = [
    "bluebird-dt==0.4.0",
    "bluebird-api==0.2.0",
    "bluebird-gymnasium==0.2.0",
    "mkdocs==1.6.1",
    "mkdocs-jupyter==0.26.3",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
    "mkdocs-monorepo-plugin==1.1.2",
    "mkdocs-macros-plugin==1.5.0",
]

[dependency-groups]
dev = [ 
  "pytest>=9.1.1,<10",
  "mktestdocs"
]

[tool.uv.sources]
bluebird-dt = { workspace = true }
bluebird-api = { workspace = true }
bluebird-gymnasium = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
