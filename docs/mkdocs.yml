site_name: Project Bluebird documentation
site_url: https://docs.projectbluebird.ai
repo_url: https://github.com/project-bluebird/BluebirdATC
repo_name: project-bluebird/BluebirdATC
docs_dir: src
site_dir: ../site
dev_addr: 127.0.0.1:8010
watch:
  - ../bluebird-dt/docs
  - ../bluebird-api/docs
  - ../bluebird-gymnasium/docs
  - ../bluebird-hmi/docs
  - ../bluebird-dt/bluebird_dt
  - ../bluebird-api/bluebird_api
  - ../bluebird-gymnasium/bluebird_gymnasium
  - ../bluebird-dt/mkdocs.yml
  - ../bluebird-api/mkdocs.yml
  - ../bluebird-gymnasium/mkdocs.yml
  - ../bluebird-hmi/mkdocs.yml
extra_css:
  - stylesheets/nav.css

theme:
  name: material
  logo: assets/logo.png
  palette:
    primary: 'blue'
    accent: 'indigo'
  features:
    - navigation.instant
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
    - navigation.indexes
    - navigation.sections


markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocs-jupyter:
      include:
        - "*.ipynb"
      include_source: true
  - monorepo
  - mkdocstrings:
       handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true

validation:
  nav:
    omitted_files: ignore
    not_found: ignore

nav:
  - Project Bluebird: index.md

  - User guide:
    - Getting started: getting-started.md

    - ATC concepts:
        - Overview: atc-introduction-and-glossary.md
        - ATC Instructions: atc-introduction-and-glossary.md#atc-instructions
        - Glossary: atc-introduction-and-glossary.md#glossary
        - Airspace: atc-introduction-and-glossary.md#airspace
        - Instruction: atc-introduction-and-glossary.md#instruction
        - Aircraft: atc-introduction-and-glossary.md#aircraft
        - Miscellaneous: atc-introduction-and-glossary.md#miscellaneous

  - bluebird-dt: "!include ../bluebird-dt/mkdocs.yml"

  - bluebird-api: "!include ../bluebird-api/mkdocs.yml"

  - bluebird-gymnasium: "!include ../bluebird-gymnasium/mkdocs.yml"

  - bluebird-hmi: "!include ../bluebird-hmi/mkdocs.yml"

  - Development:
    - How to contribute: how-to-contribute.md
    - Docs:
      - Intro: mkdocs-guide/#intro
      - Serve the docs locally: mkdocs-guide/#serve-the-docs-locally
      - Build the docs for production: mkdocs-guide/#build-the-docs-for-production
      - File hierarchy: mkdocs-guide/#file-hierarchy
      - Example edit-serve-build workflow: mkdocs-guide/#example-edit-serve-build-workflow
